services:
  - type: web
    name: datamind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_THINKING_LEVEL
        value: low
      - key: AI_MAX_SOURCE_CHARS
        value: 18000
      - key: AI_MAX_OUTPUT_TOKENS
        value: 3600
      - key: AI_ESTIMATED_TPM_BUDGET
        value: 7600
      - key: AI_MAX_RETRIES
        value: 0
      - key: AI_MIN_INTERVAL_SECONDS
        value: "1.5"
      - key: AI_TIMEOUT_SECONDS
        value: "25"
      - key: AI_FALLBACK_TO_DEMO
        value: true
      - key: MAX_UPLOAD_MB
        value: 8
      - key: MAX_TEXT_CHARS
        value: 100000
      - key: RATE_LIMIT_PER_MINUTE
        value: 12
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://anup-prasad1408.github.io,http://localhost:5173,http://127.0.0.1:5173
